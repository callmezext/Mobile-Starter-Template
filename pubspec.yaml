name: poliwangi_mobile_starter
description: "Starter template repositori tugas praktikum Pemrograman Perangkat Bergerak - TRPL Poliwangi 2026."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_riverpod: ^3.3.2
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
